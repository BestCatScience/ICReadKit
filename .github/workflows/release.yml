name: Release

# Pushing a tag such as v0.2.0 builds the XCFramework, checks the public API and
# publishes a GitHub Release with the zip, its SwiftPM checksum and the README.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the kit's version
        run: |
          version="$(sed -n 's/.*public static let version = "\(.*\)".*/\1/p' Sources/ICReadKit/CardReader.swift)"
          [[ "v$version" == "$TAG" ]] || { echo "CardReader.version is $version but the tag is $TAG" >&2; exit 1; }
      - name: Build the XCFramework
        run: bash scripts/build-xcframework.sh
      - name: Check the public API against the baseline
        run: bash scripts/check-api.sh
      - name: Package and publish
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent ICReadKit.xcframework ICReadKit.xcframework.zip
          checksum="$(swift package compute-checksum ICReadKit.xcframework.zip)"
          echo "$checksum" > ICReadKit.xcframework.zip.checksum
          cat > notes.md <<NOTES
          Binary distribution of ICReadKit $TAG.

          Swift Package Manager:

          \`\`\`swift
          .binaryTarget(
              name: "ICReadKit",
              url: "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/ICReadKit.xcframework.zip",
              checksum: "$checksum"
          )
          \`\`\`

          See README.md for the Info.plist keys and entitlements a host app needs.
          NOTES
          gh release create "$TAG" ICReadKit.xcframework.zip ICReadKit.xcframework.zip.checksum ../README.md \
            --title "ICReadKit $TAG" --notes-file notes.md
