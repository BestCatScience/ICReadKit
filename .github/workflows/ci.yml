name: ICReadKit CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly regression on a fixed day, so a new Xcode or simulator image is caught
  # even when nobody changes the code.
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: icreadkit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Security review checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review checks (URL literals, logging, storage, PIN commands, new dependencies)
        run: python3 scripts/review_checks.py
      - name: Test the checks and the agent hooks
        run: python3 -m unittest discover -s scripts/tests

  apple:
    name: Test, package and check the API
    needs: review
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=26.4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the Xcode project
        run: bash scripts/generate-project.sh
      - name: Unit tests
        run: |
          xcodebuild test -quiet -project ICReadKit.xcodeproj -scheme ICReadKit \
            -destination "$SIMULATOR" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: UI tests with demo cards
        run: |
          xcodebuild test -quiet -project ICReadKit.xcodeproj -scheme ICReadSample \
            -destination "$SIMULATOR" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Run the doctor on the sample app, as a host app would
        run: |
          python3 scripts/icreadkit_doctor.py ios \
            build/DerivedData/Build/Products/Debug-iphonesimulator/ICReadSample.app \
            --entitlements App/ICReadSample/ICReadSample.entitlements
      - name: Build the XCFramework
        run: bash scripts/build-xcframework.sh
      - name: The XCFramework carries its privacy manifest
        run: test -f build/ICReadKit.xcframework/ios-arm64/ICReadKit.framework/PrivacyInfo.xcprivacy
      - name: Check the public API against the baseline
        run: bash scripts/check-api.sh

  e2e:
    name: iOS Maestro E2E with demo cards
    needs: review
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      SIMULATOR_NAME: iPhone 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # macOS minutes are costly on a private repository, so a pull request runs
      # the flows only when it can change what the screens do.
      - name: Decide whether the screens can change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]] ||
             git diff --name-only HEAD^1 HEAD | grep -qE '^(App/|Sources/|maestro/|project\.yml$|scripts/maestro\.sh$|\.github/workflows/)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No screen-facing change; skipping the Maestro flows.'
          fi
      - name: Pick the iPhone simulator
        if: steps.scope.outputs.run == 'true'
        run: |
          udid="$(xcrun simctl list devices available -j | ruby -rjson -e '
            name = ENV.fetch("SIMULATOR_NAME")
            device = JSON.parse(STDIN.read).fetch("devices").values.flatten.find { |d| d["name"] == name && d["isAvailable"] }
            abort("No available simulator named #{name}") unless device
            puts device.fetch("udid")
          ')"
          echo "MAESTRO_DEVICE_ID=$udid" >> "$GITHUB_ENV"
      - name: Run the shared Maestro flows on iOS
        if: steps.scope.outputs.run == 'true'
        env:
          MAESTRO_JUNIT_PATH: build/maestro/report.xml
        run: bash scripts/maestro.sh ios
      - name: Print the Maestro report
        if: always() && steps.scope.outputs.run == 'true'
        run: cat build/maestro/report.xml || echo 'No Maestro report was written.'

  android:
    name: Android unit tests, lint and builds
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests, lint, the AAR and a minified release app
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew --no-daemon :icreadkit:testDebugUnitTest :icreadkit:lintRelease \
            :icreadkit:assembleRelease :sample:assembleRelease
      - name: Run the doctor on the AAR and the minified sample app
        run: |
          python3 scripts/icreadkit_doctor.py android android/icreadkit/build/outputs/aar/icreadkit-release.aar
          python3 scripts/icreadkit_doctor.py android android/sample/build/outputs/apk/release/sample-release.apk

  android-e2e:
    name: Android Compose UI tests and Maestro E2E
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Decide whether the screens can change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]] ||
             git diff --name-only HEAD^1 HEAD | grep -qE '^(android/|maestro/|scripts/(maestro|android-emulator)\.sh$|\.github/workflows/)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No Android screen change; skipping the emulator.'
          fi
      - name: Start the emulator
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/android-emulator.sh
      - name: Compose UI tests
        if: steps.scope.outputs.run == 'true'
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew --no-daemon :sample:connectedDebugAndroidTest
      - name: Run the shared Maestro flows on Android
        if: steps.scope.outputs.run == 'true'
        env:
          MAESTRO_JUNIT_PATH: build/maestro/report-android.xml
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash scripts/maestro.sh android

  server:
    name: Verification server (Go)
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests, including the OpenAPI contract
        run: go test ./...
