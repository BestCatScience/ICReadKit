appId: com.bestcatscience.icreadsample
name: A valid demo card shows the certificate as valid
tags: [ci]
---
- launchApp:
    clearState: true
- tapOn:
    id: demo-card-valid
- tapOn:
    id: read-button
- extendedWaitUntil:
    visible:
      id: result-validity
    timeout: 15000
- assertVisible:
    id: result-validity
    text: ".*有効.*"
- assertVisible:
    id: result-period
# Bring the result into the middle of the screen so both platforms are captured alike.
- scrollUntilVisible:
    element:
      id: result-period
    centerElement: true
- takeScreenshot: valid-card
